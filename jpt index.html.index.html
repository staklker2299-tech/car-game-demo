<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Car Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }

    canvas {
      display: block;
    }

    /* КНОПКИ */
    #controls {
      position: fixed;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      pointer-events: none;
    }

    .btn {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      pointer-events: auto;
    }

    .btn:active {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <div id="controls">
    <div class="btn left">◀</div>
    <div class="btn right">▶</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
